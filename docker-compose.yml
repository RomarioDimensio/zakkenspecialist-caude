name: dezakkenspecialist

services:
  deZakkenspecialist:
    image: wordpress:latest
    container_name: wordpress
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./php.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      WORDPRESS_DB_NAME: wordpress2
      WORDPRESS_TABLE_PREFIX: wp2_
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_DEBUG: "true"

      ALGOLIA_APP_ID: 13DGEUP5OS
      ALGOLIA_SEARCH_KEY: a1e4c48c13552bd41a00c67173a404b6
      ALGOLIA_ADMIN_API_KEY: e43e8fea731d58e620683cd1e3fef733

      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', '/var/www/html/wp-content/debug.log');
        define('ALGOLIA_APP_ID', getenv('ALGOLIA_APP_ID'));
        define('ALGOLIA_ADMIN_API_KEY', getenv('ALGOLIA_ADMIN_API_KEY'));
        define('ALGOLIA_SEARCH_KEY', getenv('ALGOLIA_SEARCH_KEY'));
    depends_on:
      - db
      - phpmyadmin
    restart: always
    ports:
      - "8083:80"

  db:
    image: mariadb:latest
    container_name: db
    volumes:
      - db3_data:/var/lib/mysql
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: wordpress2
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      - db
    restart: always
    ports:
      - "8183:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: password

volumes:
  db3_data: